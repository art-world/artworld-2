<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ARTWORLD</title>
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('../vendor/fonts/VT323-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: 'VT323', ui-monospace, monospace;
    }

    #view {
      display: block;
      width: 100%;
      height: 100%;
      /* The canvas owns the gesture. Without this a drag scrolls the page
         on a phone and the shader never sees the move. */
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #000;
      color: #fff;
      font-family: 'VT323', ui-monospace, monospace;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      z-index: 10;
      transition: opacity 0.9s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .count { font-size: 46px; line-height: 1; }
    #loading .label { font-size: 17px; opacity: 0.5; }
    #loading .bar {
      width: min(280px, 56vw);
      height: 2px;
      background: rgba(255, 255, 255, 0.16);
    }
    #loading .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.25s ease;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease 0.4s;
      mix-blend-mode: difference;
    }
    #ui.ready { opacity: 1; }

    .arrow {
      position: absolute;
      top: 50%;
      width: 64px;
      height: 64px;
      margin-top: -32px;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      pointer-events: auto;
      opacity: 0.45;
      transition: opacity 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .arrow:hover, .arrow:focus-visible { opacity: 1; outline: none; }
    .arrow.prev { left: 12px; }
    .arrow.next { right: 12px; }

    .arrow::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      margin: -8px 0 0 -8px;
      border-top: 2px solid #fff;
      border-right: 2px solid #fff;
    }
    .arrow.next::before { transform: rotate(45deg); }
    .arrow.prev::before { transform: rotate(-135deg); }

    .readout {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      text-align: center;
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      user-select: none;
    }
    .index { opacity: 0.55; }
    .title { font-size: 30px; letter-spacing: 0.3em; }
    .hint {
      font-size: 17px;
      letter-spacing: 0.2em;
      opacity: 0;
      transition: opacity 0.6s ease;
      min-height: 1.35em;
    }

    .mark {
      position: absolute;
      top: 26px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
      letter-spacing: 0.42em;
      opacity: 0.5;
      text-transform: uppercase;
      user-select: none;
    }

    @media (max-width: 640px) {
      .arrow { width: 52px; height: 52px; margin-top: -26px; }
      .title { font-size: 24px; }
      .readout { font-size: 18px; bottom: 18px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../vendor/three/build/three.module.js",
        "three/addons/": "../vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading">
    <div class="count">00</div>
    <div class="bar"><i></i></div>
    <div class="label">loading</div>
  </div>

  <div id="ui">
    <div class="mark">ARTWORLD</div>
    <button class="arrow prev" type="button" aria-label="Previous track"></button>
    <button class="arrow next" type="button" aria-label="Next track"></button>
    <div class="readout">
      <div class="index">01 / 06</div>
      <div class="title"></div>
      <div class="hint"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
